id = "herdr-todo"
name = "Herdr Todo"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Plan your work and remember what you finished, one shortcut away."
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open tasks"
contexts = ["workspace", "pane"]
command = ["python3", "todo.py", "open"]

[[panes]]
id = "tasks"
title = "Tasks"
placement = "popup"
width = "85%"
height = "80%"
command = ["python3", "todo.py", "ui"]
