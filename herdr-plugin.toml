id = "herdr-todo"
name = "Herdr Todo"
version = "0.2.0"
min_herdr_version = "0.9.3"
description = "Plan your work and remember what you finished, one shortcut away."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[actions]]
id = "open"
title = "Open tasks"
contexts = ["workspace", "pane"]
command = ["./bin/herdr-todo", "open"]

[[panes]]
id = "tasks"
title = "Tasks"
placement = "popup"
width = "85%"
height = "80%"
command = ["./bin/herdr-todo", "ui"]
