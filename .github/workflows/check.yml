name: Check and release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build without a C runtime
        run: CGO_ENABLED=0 go build -trimpath -o bin/herdr-todo .
      - name: Check CLI and release versions
        run: |
          test "$(./bin/herdr-todo --version)" = "$(cat VERSION)"
          grep -q "^version = \"$(cat VERSION)\"$" herdr-plugin.toml
          ./bin/herdr-todo --help

  package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: sh scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Herdr Todo $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
